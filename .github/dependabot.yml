version: 2
updates:
  # Dependency PRs are suggestions only; review, verify provenance and test before merging.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pinned and current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    groups:
      # init and analyze must run the same version or the CodeQL job fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"

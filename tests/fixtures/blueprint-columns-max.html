<!doctype html>
<html><head><style>
  body { margin: 0; background: #fff; font-family: sans-serif; }
  header { height: 80px; background: #111; }
  .pad { height: 800px; width: 100%; }
  .footer-cols { width: 100%; background: #222; color: #fff; }
  .linkrow { display: flex; }
  .linkcol { width: 320px; height: 60px; box-sizing: border-box; }
  .cardrow { display: flex; }
  .card { height: 200px; box-sizing: border-box; padding: 8px; }
  .card-a, .card-b, .card-c { width: 300px; }
  .card-d { width: 380px; }
  .btn { display: inline-block; padding: 8px 12px; background: #f4a53c; color: #111; }
  footer { height: 100px; background: #000; }
</style></head><body>
<header></header>
<div class="pad"></div>
<section class="footer-cols">
  <div class="linkrow">
    <div class="linkcol">Company</div>
    <div class="linkcol">Support</div>
    <div class="linkcol">Legal</div>
    <div class="linkcol">Social</div>
  </div>
  <div class="cardrow">
    <div class="card card-a"><a class="btn" href="#">One</a></div>
    <div class="card card-b"><a class="btn" href="#">Two</a></div>
    <div class="card card-c"><a class="btn" href="#">Three</a></div>
    <div class="card card-d"><a class="btn" href="#">Four</a></div>
  </div>
</section>
<footer></footer>
</body></html>

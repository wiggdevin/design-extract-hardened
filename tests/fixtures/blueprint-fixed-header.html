<!doctype html>
<html><head><style>
  * { box-sizing: border-box; }
  body { margin: 0; padding-top: 80px; font-family: sans-serif; }
  header { position: fixed; top: 0; left: 0; width: 100%; height: 80px; background: #0f2a44; color: #fff; z-index: 10; }
  section { width: 100%; height: 800px; }
  .s1 { background: #f3efe6; }
  .s2 { background: #ffffff; }
  .s3 { background: #eee; }
  .s4 { background: #ddd; }
  .s5 { background: #ccc; }
  .s6 { background: #bbb; }
</style></head><body>
<header>Fixed header</header>
<main>
  <section class="s1">Section 1</section>
  <section class="s2">Section 2</section>
  <section class="s3">Section 3</section>
  <section class="s4">Section 4</section>
  <section class="s5">Section 5</section>
  <section class="s6">Section 6</section>
</main>
</body></html>

<!doctype html>
<html><head><style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; }
  #boxed, #wrapper, main { width: 100%; }
  .fusion-fullwidth { width: 100%; }
  .fusion-builder-row { max-width: 1100px; margin: 0 auto; }
  .row1 { display: flex; }
  .row1 > div { width: 50%; height: 400px; }
  .row1-a { background: #f3efe6; }
  .row1-b { background: #ffffff; }
  .fusion_builder_column_1_1 { width: 100%; height: 700px; }
  .col-2a { background: #eeeeee; }
  .col-2b { background: #dddddd; }
  .col-2c { background: #cccccc; }
  .row3-col { width: 100%; height: 500px; background: #163a5c; }
</style></head><body>
<div id="boxed"><div id="wrapper"><main>
  <div class="fusion-fullwidth fw1"><div class="fusion-builder-row row1">
    <div class="row1-a"><h2>Left</h2></div>
    <div class="row1-b"><h2>Right</h2></div>
  </div></div>
  <div class="fusion-fullwidth fw2"><div class="fusion-builder-row row2">
    <div class="fusion_builder_column_1_1 col-2a"><h2>Card one</h2></div>
    <div class="fusion_builder_column_1_1 col-2b"><h2>Card two</h2></div>
    <div class="fusion_builder_column_1_1 col-2c"><h2>Card three</h2></div>
  </div></div>
  <div class="fusion-fullwidth fw3"><div class="fusion-builder-row row3">
    <div class="row3-col"><h2>Closing</h2></div>
  </div></div>
</main></div></div>
</body></html>
